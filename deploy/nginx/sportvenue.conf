# ============================================================
# NGINX NGOÀI CÙNG — chạy TRÊN MÁY CHỦ, không nằm trong docker compose.
#
# Đặt file này tại /etc/nginx/sites-available/sportvenue.conf rồi:
#     sudo ln -s /etc/nginx/sites-available/sportvenue.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Hai khối HTTPS bên dưới cần chứng chỉ. Lấy bằng certbot TRƯỚC (xem DEPLOY.md);
# certbot sẽ tự chèn các dòng ssl_certificate vào đây, hoặc bạn tự điền.
# ============================================================

# ===== Chuyển hết HTTP sang HTTPS =====
# Cổng thanh toán yêu cầu IPN qua https, và token đăng nhập đi qua http là ai
# cùng mạng Wi-Fi cũng đọc được.
server {
    listen 80;
    listen [::]:80;
    server_name sportvenue.vn www.sportvenue.vn api.sportvenue.vn;

    # Chừa đường cho certbot gia hạn chứng chỉ mà không phải tắt nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== FRONTEND =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sportvenue.vn www.sportvenue.vn;

    ssl_certificate     /etc/letsencrypt/live/sportvenue.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportvenue.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Buộc trình duyệt chỉ dùng https trong 1 năm. Chỉ bật khi đã chắc chắn
    # chứng chỉ hoạt động ổn — bật rồi thì không gỡ ngược lại được trong thời
    # hạn này, và nếu chứng chỉ hỏng thì người dùng không vào được site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== BACKEND API =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sportvenue.vn;

    ssl_certificate     /etc/letsencrypt/live/api.sportvenue.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sportvenue.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ảnh địa điểm và giấy tờ hồ sơ chủ sân. Giới hạn 10MB đủ cho ảnh điện thoại
    # mà vẫn chặn được việc ai đó đẩy file khổng lồ làm đầy ổ đĩa.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ⚠️ Dòng này BẮT BUỘC phải có. Không có nó, mọi request đến backend đều
        # mang IP của nginx (127.0.0.1), nên giới hạn tần suất gom toàn bộ người
        # dùng vào chung một hạn mức và chặn oan tất cả sau vài trăm request.
        # Phía backend đã bật app.set('trust proxy', 1) để đọc header này.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ===== Webhook đối soát ngân hàng (tuỳ chọn) =====
    # Chỉ có tác dụng nếu bạn bật "Đối soát tự động" và cấu hình một dịch vụ
    # theo dõi sao kê (SePay, Casso...) trỏ về đây. Tách riêng để đặt timeout
    # rộng hơn: nhánh xử lý có thể phải chạy cả một giao dịch chuyển sân (tạo
    # đơn mới, ghi sổ cái, gửi thông báo) trước khi trả lời.
    location = /api/payments/bank/webhook {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Ảnh upload: cache dài vì tên file có timestamp nên không bao giờ bị ghi đè.
    location /uploads/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
