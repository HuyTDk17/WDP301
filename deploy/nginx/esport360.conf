# ============================================================
# NGINX NGOÀI CÙNG — chạy TRÊN MÁY CHỦ, không nằm trong docker compose.
#
# Đặt file này tại /etc/nginx/sites-available/esport360.conf rồi:
#     sudo ln -s /etc/nginx/sites-available/esport360.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Hai khối HTTPS bên dưới cần chứng chỉ. Lấy bằng certbot TRƯỚC (xem DEPLOY.md);
# certbot sẽ tự chèn các dòng ssl_certificate vào đây, hoặc bạn tự điền.
# ============================================================

# ===== Chuyển hết HTTP sang HTTPS =====
# Cổng thanh toán yêu cầu IPN qua https, và token đăng nhập đi qua http là ai
# cùng mạng Wi-Fi cũng đọc được.
server {
    listen 80;
    listen [::]:80;
    server_name esport360.vn www.esport360.vn api.esport360.vn;

    # Chừa đường cho certbot gia hạn chứng chỉ mà không phải tắt nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== FRONTEND =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name esport360.vn www.esport360.vn;

    ssl_certificate     /etc/letsencrypt/live/esport360.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esport360.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Buộc trình duyệt chỉ dùng https trong 1 năm. Chỉ bật khi đã chắc chắn
    # chứng chỉ hoạt động ổn — bật rồi thì không gỡ ngược lại được trong thời
    # hạn này, và nếu chứng chỉ hỏng thì người dùng không vào được site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # server.js cố tình TẮT contentSecurityPolicy của helmet (backend chỉ trả
    # JSON, không phục vụ HTML nên CSP không có tác dụng gì ở đó) và để lại
    # ghi chú "CSP thật được đặt ở tầng nginx cho frontend" — đây chính là chỗ
    # đó. Domain ngoài được cho phép vì frontend thật sự tải ảnh/QR/script từ đó:
    #   - script-src/connect-src/frame-src accounts.google.com: nút "Đăng nhập
    #     bằng Google" (Google Identity Services) — xem GoogleSignInButton.jsx.
    #     Bỏ 3 domain này nếu không dùng tính năng đăng nhập Google.
    #   - img-src lh3.googleusercontent.com: ảnh đại diện lấy từ tài khoản Google.
    #   - xem thêm e360sport/src/utils/index.js#getAvatarPlaceholder, VenueCard.jsx,
    #     backend/utils/bankTransfer.js#img.vietqr.io.
    # Đổi tên miền api.esport360.vn bên dưới nếu bạn dùng tên miền khác cho backend.
    # style-src cần 'unsafe-inline' vì React set style qua thuộc tính
    # style="" (style={{...}}) — CSP tính cả việc này là "inline style".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.esport360.vn https://img.vietqr.io https://images.unsplash.com https://placehold.co https://ui-avatars.com https://lh3.googleusercontent.com; connect-src 'self' https://api.esport360.vn https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # Trình duyệt cũ không hiểu frame-ancestors thì vẫn được chặn bởi header này.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Chặn trình duyệt tự đoán content-type khác với header server trả về —
    # tránh một file .txt do người dùng tải lên bị thực thi như .html/.js.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== BACKEND API =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.esport360.vn;

    ssl_certificate     /etc/letsencrypt/live/api.esport360.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.esport360.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ảnh địa điểm (tối đa 8 ảnh × 5MB khi tạo/sửa địa điểm — xem
    # backend/routes/ownerRoutes.js) và giấy tờ hồ sơ chủ sân (tối đa 5 tệp ×
    # 5MB — xem backend/middleware/uploadPrivate.js). Trường hợp xấu nhất là
    # 8×5MB = 40MB trong MỘT request tạo địa điểm kèm ảnh; 45M chừa thêm chút
    # cho phần overhead của multipart form-data (boundary, tên trường...).
    # Đặt THẤP hơn giới hạn thật của multer sẽ khiến nginx trả 413 trước khi
    # request kịp tới backend — chủ sân tải vài ảnh điện thoại là dính lỗi.
    client_max_body_size 45M;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ⚠️ Dòng này BẮT BUỘC phải có. Không có nó, mọi request đến backend đều
        # mang IP của nginx (127.0.0.1), nên giới hạn tần suất gom toàn bộ người
        # dùng vào chung một hạn mức và chặn oan tất cả sau vài trăm request.
        # Phía backend đã bật app.set('trust proxy', 1) để đọc header này.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ===== Webhook đối soát ngân hàng (tuỳ chọn) =====
    # Chỉ có tác dụng nếu bạn bật "Đối soát tự động" và cấu hình một dịch vụ
    # theo dõi sao kê (SePay, Casso...) trỏ về đây. Tách riêng để đặt timeout
    # rộng hơn: nhánh xử lý có thể phải chạy cả một giao dịch chuyển sân (tạo
    # đơn mới, ghi sổ cái, gửi thông báo) trước khi trả lời.
    location = /api/payments/bank/webhook {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Ảnh upload: cache dài vì tên file có timestamp nên không bao giờ bị ghi đè.
    location /uploads/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
