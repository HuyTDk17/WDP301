services:
  mongo:
    image: mongo:7
    container_name: e360sport-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Replica set 1 node để hỗ trợ transaction (chống double-booking khi tạo booking).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
