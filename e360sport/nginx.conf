server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nén văn bản. Bundle JS hiện khoảng 560 KB, gzip xuống còn ~170 KB — khác
    # biệt rất rõ với người dùng mạng 3G/4G ở Việt Nam.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # File có hash trong tên (index-a1b2c3.js) thì nội dung không bao giờ đổi,
    # nên cache vĩnh viễn được. Đổi bản mới sẽ sinh tên file mới.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html thì TUYỆT ĐỐI không cache: nó là nơi trỏ tới các file hash ở
    # trên. Cache nhầm file này là người dùng kẹt mãi ở bản cũ sau mỗi lần deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Ứng dụng một trang: mọi đường dẫn không khớp file nào đều trả index.html
    # để React Router tự xử lý. Thiếu dòng này thì tải lại trang ở /bookings sẽ
    # ra lỗi 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Một vài header bảo mật cơ bản cho phía trình duyệt.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
